name: Run all cypress tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./task-launcher/package.json
          cache: 'npm'
          cache-dependency-path: ./task-launcher/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./task-launcher

      - name: Run cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          working-directory: ./task-launcher
          start: npm run dev:db
