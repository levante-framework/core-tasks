name: npm install and build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./task-launcher/package.json
          cache: 'npm'
          cache-dependency-path: ./task-launcher/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./task-launcher

      - name: Build the project
        run: npm run build
        working-directory: ./task-launcher
